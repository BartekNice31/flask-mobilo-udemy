<!DOCTYPE html>
<html>
    <head>
        <title>Cantor</title>
        <meta charset="utf8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1>You have selected currency: {{currency}} and amount: {{amount}} in {{cantor_name}} </h1> 
        {%for message in get_flashed_messages()%}
            <div>{{message}}</div>
        {%endfor%}
        {%if currency_info.code!='uknown'%}
            <img src="{{url_for('static',filename=currency_info.flag)}}">
        {%else%}
            <p>This currency currency_info.code is unknown for us</p>
        {%endif%}
    </body>
</html>
